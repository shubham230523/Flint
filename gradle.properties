# Kotlin Code Style & Incremental Compilation (Optimized for Low-Hardware Laptops)
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048M -XX:+UseG1GC
kotlin.incremental=true
kotlin.incremental.js=true
kotlin.incremental.wasm=true
kotlin.incremental.multiplatform=true
kotlin.mpp.enableCInteropCommonization=false
kotlin.native.ignoreDisabledTargets=true

# Gradle Build Performance & Low-Memory Tuning
org.gradle.jvmargs=-Xmx2048M -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=10 -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.vfs.watch=true
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.tooling.parallel=true

# Android Optimizations
android.nonTransitiveRClass=true
android.useAndroidX=true
android.enableR8.fullMode=true
android.enableAapt2Worker=true
