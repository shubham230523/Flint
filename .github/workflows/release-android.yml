name: Release Android APK

on:
  push:
    tags:
      - 'v*'

jobs:
  release-android:
    name: Build & Publish Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android Release APK
        run: ./gradlew :androidApp:assembleRelease --stacktrace
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL_NAME: ${{ secrets.OPENROUTER_MODEL_NAME }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Prepare Signed APK for Release
        run: |
          cp androidApp/build/outputs/apk/release/androidApp-release.apk androidApp/build/outputs/apk/release/Flint-Android-Release.apk
        shell: bash

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Flint Android ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            androidApp/build/outputs/apk/release/Flint-Android-Release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
