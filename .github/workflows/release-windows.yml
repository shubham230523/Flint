name: Release Windows Desktop App

on:
  push:
    tags:
      - 'v*'

jobs:
  release-windows:
    name: Build & Publish Windows Desktop Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Windows Executable & Distributable
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS --stacktrace
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL_NAME: ${{ secrets.OPENROUTER_MODEL_NAME }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Create Portable Zip Package
        run: |
          if (Test-Path "desktopApp/build/compose/binaries/main/app") {
            Compress-Archive -Path "desktopApp/build/compose/binaries/main/app" -DestinationPath "desktopApp/build/compose/binaries/main/Flint-Windows-Portable.zip" -Force
          }
        shell: powershell

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Flint Desktop ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            desktopApp/build/compose/binaries/main/exe/*.exe
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
